 g('outlineVal').textContent=(+g('outline').value).toFixed(1)+'px';
}
root.querySelectorAll('button[data-aa]').forEach(b=>b.addEventListener('click',()=>{method=+b.dataset.aa;refresh();render();}));
root.querySelectorAll('button[data-shade]').forEach(b=>b.addEventListener('click',()=>{shade=+b.dataset.shade;refresh();render();}));
for(const k of ['zoom','outline'])g(k).addEventListener('input',()=>{refresh();render();});
refresh();
cv.addEventListener('pointerdown',e=>{drag=true;px=e.clientX;py=e.clientY;cv.setPointerCapture(e.pointerId);});
cv.addEventListener('pointermove',e=>{if(!drag)return;yaw-=(e.clientX-px)*.008;pitch=clamp(pitch+(e.clientY-py)*.008,-1.2,1.34);px=e.clientX;py=e.clientY;render();});
cv.addEventListener('pointerup',()=>drag=false);cv.addEventListener('pointercancel',()=>drag=false);
cv.addEventListener('wheel',e=>{e.preventDefault();distance=clamp(distance*Math.exp(e.deltaY*.001),2,55);render();},{passive:false});
function camUniforms(U,eye,right,up,forward,w,h){
 gl.uniform3fv(U.eye,eye);gl.uniform3fv(U.camRight,right);gl.uniform3fv(U.camUp,up);gl.uniform3fv(U.camForward,forward);
 gl.uniform1f(U.focal,1.65);gl.uniform1f(U.aspect,w/h);
}
function render(){
 const w=Math.max(280,Math.round(cv.clientWidth)),h=Math.max(240,Math.round(cv.clientHeight));
 if(cv.width!==w||cv.height!==h){cv.width=w;cv.height=h;}
 const scaled=method===3?2:1,rw=w*scaled,rh=h*scaled;
 allocate(rw,rh);
 if((method===2||method===4)&&!msReady){g('error').textContent='MSAA unavailable on this GPU. Choose FXAA or SSAA.';return;}
 g('error').textContent='';
 const visualZoom=+g('zoom').value;
 const eye=add(center,[distance/visualZoom*Math.sin(yaw)*Math.cos(pitch),distance/visualZoom*Math.sin(pitch),distance/visualZoom*Math.cos(yaw)*Math.cos(pitch)]);
 const forward=unit(sub(center,eye)),right=unit(cross(forward,[0,1,0])),up=unit(cross(right,forward)),sky=[.58,.66,.74],light=unit([-.55,.62,.56]);
 const isMS=method===2||method===4;
 gl.bindFramebuffer(gl.FRAMEBUFFER,isMS?msFBO:gbuffer);
 gl.viewport(0,0,rw,rh);gl.drawBuffers([gl.COLOR_ATTACHMENT0,gl.COLOR_ATTACHMENT1]);
 gl.clearBufferfv(gl.COLOR,0,[...sky,1]);gl.clearBufferfv(gl.COLOR,1,[0,0,0,0]);gl.clearBufferfv(gl.DEPTH,0,[1]);
 gl.enable(gl.DEPTH_TEST);gl.depthFunc(gl.LESS);gl.disable(gl.CULL_FACE);
 gl.bindVertexArray(vao);gl.useProgram(programs[0]);let U=uniforms[0];camUniforms(U,eye,right,up,forward,rw,rh);
 gl.uniform3fv(U.lightDir,light);gl.uniform3fv(U.skyColor,sky);
 gl.uniform1f(U.intensity,.85);gl.uniform1f(U.ambient,.32);
 gl.uniform1f(U.mode,shade===3?2:shade);gl.uniform1f(U.bands,4);
 gl.drawArrays(gl.TRIANGLES,0,vertexCount);
 if(isMS){
   gl.bindFramebuffer(gl.READ_FRAMEBUFFER,msFBO);
   gl.bindFramebuffer(gl.DRAW_FRAMEBUFFER,gbuffer);
   for(let i=0;i<2;i++){
     gl.readBuffer(gl.COLOR_ATTACHMENT0+i);
     gl.drawBuffers(i===0?[gl.COLOR_ATTACHMENT0,gl.NONE]:[gl.NONE,gl.COLOR_ATTACHMENT1]);
     gl.blitFramebuffer(0,0,rw,rh,0,0,rw,rh,gl.COLOR_BUFFER_BIT,gl.NEAREST);
   }
   gl.blitFramebuffer(0,0,rw,rh,0,0,rw,rh,gl.DEPTH_BUFFER_BIT,gl.NEAREST);
   gl.bindFramebuffer(gl.FRAMEBUFFER,gbuffer);
   gl.drawBuffers([gl.COLOR_ATTACHMENT0,gl.COLOR_ATTACHMENT1]);
 }
 gl.bindFramebuffer(gl.FRAMEBUFFER,postFBO);gl.viewport(0,0,rw,rh);
 gl.disable(gl.DEPTH_TEST);gl.useProgram(programs[1]);gl.bindVertexArray(quad);U=uniforms[1];
 gl.activeTexture(gl.TEXTURE0);gl.bindTexture(gl.TEXTURE_2D,colorTex);gl.uniform1i(U.colorBuffer,0);
 gl.activeTexture(gl.TEXTURE1);gl.bindTexture(gl.TEXTURE_2D,normalTex);gl.uniform1i(U.normalBuffer,1);
 gl.activeTexture(gl.TEXTURE2);gl.bindTexture(gl.TEXTURE_2D,depthTex);gl.uniform1i(U.depthBuffer,2);
 gl.uniform2fv(U.resolution,[rw,rh]);gl.uniform1f(U.thickness,+g('outline').value*scaled);
 gl.uniform1f(U.darkness,.75);gl.uniform1f(U.crease,0);
 gl.uniform1f(U.outlineOn,shade===3?1:0);
 gl.drawArrays(gl.TRIANGLES,0,3);
 gl.bindFramebuffer(gl.FRAMEBUFFER,null);gl.viewport(0,0,w,h);gl.drawBuffers([gl.BACK]);
 gl.useProgram(programs[2]);gl.bindVertexArray(quad);U=uniforms[2];
 gl.activeTexture(gl.TEXTURE0);gl.bindTexture(gl.TEXTURE_2D,postTex);gl.uniform1i(U.srcTex,0);
 gl.uniform2fv(U.srcResolution,[rw,rh]);gl.uniform1i(U.technique,method);
 gl.drawArrays(gl.TRIANGLES,0,3);
 const err=gl.getError();if(err!==gl.NO_ERROR){g('error').textContent='WebGL error '+err;}
 g('status').textContent='181 approved parts · '+(method===3?'4× pixel workload':isMS?samples+' MSAA samples':'1 sample per pixel');
}
render();
}catch(e){status.textContent='Viewer failed';g('error').textContent='AA lab: '+String(e.message||e);}
})();

</script></div></body></html>
