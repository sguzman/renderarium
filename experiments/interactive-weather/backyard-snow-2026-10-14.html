<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"></head><body style="margin:0;background:#101822;color:#eff5ff;font:13px system-ui,sans-serif">
<div id="sc-snow" style="background:#111a26;color:#eaf3ff;border-radius:13px;overflow:hidden">
<style>
#sc-snow *{box-sizing:border-box}
#sc-snow .top{padding:12px 14px;background:#233448;display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
#sc-snow .top small{font-size:11px;color:#bdd1e9}
#sc-snow canvas{display:block;width:100%;height:400px;touch-action:none;cursor:grab;background:#8295a7}
#sc-snow canvas:active{cursor:grabbing}
#sc-snow .controls{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;padding:13px}
#sc-snow .field{display:flex;flex-direction:column;gap:5px;min-width:0}
#sc-snow label{display:flex;justify-content:space-between;gap:8px;color:#c1d4e6;font-size:12px}
#sc-snow input[type=range]{width:100%;accent-color:#b2dcff;min-width:0}
#sc-snow .actions{display:flex;gap:7px;flex-wrap:wrap;padding:0 13px 12px}
#sc-snow button{border:1px solid #5b7ea2;border-radius:7px;background:#284464;color:#edf6ff;padding:8px 10px;cursor:pointer;font:inherit}
#sc-snow button:hover{background:#38587a}
#sc-snow .note{padding:0 13px 13px;color:#aac0d6;font-size:11px}
#sc-snow .err{padding:0 13px 11px;color:#ffc0c6;font-size:12px}
@media(max-width:540px){#sc-snow canvas{height:310px}#sc-snow .controls{grid-template-columns:repeat(2,minmax(0,1fr))}}
</style>
<div class="top"><strong>Backyard · Snow laboratory</strong><small id="snow-status">Loading accepted scene…</small></div>
<canvas id="snow-canvas" aria-label="Interactive 3D snowfall over accepted block-chibi backyard"></canvas>
<div class="controls">
<div class="field"><label>Amount <span id="snow-amountVal">60%</span></label><input id="snow-amount" type="range" min="0" max="100" value="60"></div>
<div class="field"><label>Fall speed <span id="snow-speedVal">2.8</span></label><input id="snow-speed" type="range" min="0.5" max="8" step="0.1" value="2.8"></div>
<div class="field"><label>Wind ↔ <span id="snow-windVal">0.4</span></label><input id="snow-wind" type="range" min="-5" max="5" step="0.1" value="0.4"></div>
<div class="field"><label>Flake size <span id="snow-sizeVal">1.4</span></label><input id="snow-size" type="range" min="0.5" max="4" step="0.1" value="1.4"></div>
<div class="field"><label>Visibility <span id="snow-opacityVal">70%</span></label><input id="snow-opacity" type="range" min="0" max="100" value="70"></div>
<div class="field"><label>Haze <span id="snow-hazeVal">34%</span></label><input id="snow-haze" type="range" min="0" max="100" value="34"></div>
<div class="field"><label>Accumulation <span id="snow-accumVal">35%</span></label><input id="snow-accum" type="range" min="0" max="100" value="35"></div>
<div class="field"><label>Light <span id="snow-lightVal">78%</span></label><input id="snow-light" type="range" min="30" max="140" step="5" value="78"></div>
<div class="field"><label style="justify-content:start;gap:8px"><input id="snow-pause" type="checkbox"> Pause animation</label></div>
</div>
<div class="actions"><button data-preset="flurries">Flurries</button><button data-preset="steady">Steady</button><button data-preset="heavy">Heavy</button><button data-preset="blizzard">Blizzard</button><button id="snow-reset">Reset view</button></div>
<div id="snow-error" class="err"></div>
<div class="note">Drag to orbit · Wheel to zoom · Wind moves flakes horizontally · Snow cover is a visual treatment, not simulated buildup · Offline original Backyard geometry</div>
