<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"></head><body style="margin:0;background:#111725;color:#e6ecf8;font:13px system-ui"><div id="rain-demo">
<style>

#rain-demo canvas{width:100%;height:450px;display:block;touch-action:none;background:#697b8b;cursor:grab}
#rain-demo .panel{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;padding:13px}
#rain-demo label{display:flex;justify-content:space-between;gap:8px;color:#c1d3e6;font-size:12px;align-items:center}
#rain-demo .field{display:flex;flex-direction:column;gap:5px;min-width:0}
#rain-demo input[type=range]{width:100%;accent-color:#a6cfff}
#rain-demo .bar{padding:0 13px 14px;display:flex;gap:8px;flex-wrap:wrap}
#rain-demo button{color:#edf6ff;background:#2b486a;border:1px solid #4c719a;padding:7px 10px;border-radius:7px;cursor:pointer}
#rain-demo .note{padding:0 13px 13px;color:#a7bdd5;font-size:11px}
#rain-demo .error{color:#ffafb4;padding:0 12px 9px}
@media(max-width:540px){#rain-demo .panel{grid-template-columns:repeat(2,minmax(0,1fr))}#rain-demo canvas{height:310px}}
</style>

<canvas id="rain-canvas"></canvas>
<div class="panel">
<div class="field"><label>Amount <span id="rain-amountValue">65%</span></label><input id="rain-amount" type="range" min="0" max="100" step="1" value="65"></div>
<div class="field"><label>Speed <span id="rain-speedValue">6.0</span></label><input id="rain-speed" type="range" min="1" max="16" step=".5" value="6"></div>
<div class="field"><label>Wind ← / → <span id="rain-windValue">0.3</span></label><input id="rain-wind" type="range" min="-5" max="5" step=".1" value=".3"></div>
<div class="field"><label>Drop length <span id="rain-lengthValue">0.34</span></label><input id="rain-length" type="range" min=".07" max=".85" step=".01" value=".34"></div>
<div class="field"><label>Drop visibility <span id="rain-opacityValue">65%</span></label><input id="rain-opacity" type="range" min="10" max="100" step="5" value="65"></div>
<div class="field"><label>Atmospheric haze <span id="rain-hazeValue">28%</span></label><input id="rain-haze" type="range" min="0" max="100" step="1" value="28"></div>
<div class="field"><label>Light <span id="rain-lightValue">75%</span></label><input id="rain-light" type="range" min="30" max="140" step="5" value="75"></div>
<div class="field"><label style="justify-content:flex-start"><input type="checkbox" id="rain-splashes" checked> Ground splashes</label></div>
<div class="field"><label style="justify-content:flex-start"><input type="checkbox" id="rain-pause"> Pause animation</label></div>
</div>
<div class="bar"><button data-preset="drizzle">Drizzle</button><button data-preset="shower">Shower</button><button data-preset="downpour">Downpour</button><button data-preset="storm">Storm</button><button id="rain-reset">Reset camera</button></div>

cv.addEventListener('pointerdown',e=>{cv.setPointerCapture(e.pointerId);cv.dataset.drag='1';cv.dataset.px=e.clientX;cv.dataset.py=e.clientY});cv.addEventListener('pointermove',e=>{if(cv.dataset.drag!=='1')return;yaw-=(e.clientX-Number(cv.dataset.px))*.008;pitch=Math.min(1.34,Math.max(-1.2,pitch+(e.clientY-Number(cv.dataset.py))*.008));cv.dataset.px=e.clientX;cv.dataset.py=e.clientY});cv.addEventListener('pointerup',()=>cv.dataset.drag='0');cv.addEventListener('pointercancel',()=>cv.dataset.drag='0');cv.addEventListener('wheel',e=>{e.preventDefault();distance=Math.min(55,Math.max(2,distance*Math.exp(e.deltaY*.001)))},{passive:false});
