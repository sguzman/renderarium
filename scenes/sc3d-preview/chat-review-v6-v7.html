function ribbon(g){const path=g.path;for(let i=1;i<path.length;i++){let p=path[i-1],q=path[i],mid=p.map((x,j)=>(x+q[j])/2),d=normalized(diff(q,p)),u=[0,1,0];let axis=cross(u,d),l=Math.hypot(...axis);let xx,zz;if(l<1e-7){xx=[1,0,0];zz=[0,0,1]}else{axis=axis.map(v=>v/l);let dot=u.reduce((s,v,j)=>s+v*d[j],0);const angle=Math.acos(Math.max(-1,Math.min(1,dot)));const R=p=>{let c=Math.cos(angle),s=Math.sin(angle),o=cross(axis,p),k=axis.reduce((a,v,j)=>a+v*p[j],0);return p.map((v,j)=>v*c+o[j]*s+axis[j]*k*(1-c))};xx=R([1,0,0]);zz=R([0,0,1])}
const v=(x,y,z)=>mid.map((m,k)=>m+xx[k]*x+d[k]*y+zz[k]*z),w=g.width/2,h=Math.hypot(...diff(q,p))/2,t=g.depth/2;
let a=v(-w,-h,-t),b=v(w,-h,-t),c=v(w,h,-t),e=v(-w,h,-t),f=v(-w,-h,t),G=v(w,-h,t),H=v(w,h,t),J=v(-w,h,t);quad(a,b,c,e);quad(f,J,H,G);quad(a,f,G,b);quad(e,c,H,J);quad(a,e,J,f);quad(b,G,H,c)}}

function build(key){
 emit.length=0;let dat=payload[key];if(!dat)throw Error('Unknown car version');let materials=dat.m;
 for(let [g,t,m]of dat.p){mesh=g;mesh.transformPart=t;matColor=colorConvert(materials[m]||'#999999');
 switch(g.kind){case'cuboid':cuboid(...g.size);break;case'rounded_box':rounded(g);break;case'tapered_box':tapered(g);break;case'cylinder':cylinder(g);break;case'polygon_prism':polygon(g);break;case'loft':loft(g);break;case'ribbon_path':ribbon(g);break;default:throw Error('Unknown geometry '+g.kind)} }
 geometry=new Float32Array(emit);version=key;
 label.textContent=`SC3D source geometry · Car ${key} · ${dat.p.length} parts · drag to orbit · scroll to zoom`;
 root.querySelectorAll('[data-model]').forEach(b=>b.classList.toggle('selected',b.dataset.model===key));draw();
}
function draw(){
if(!geometry)return;
const rect=canvas.getBoundingClientRect();const targetWidth=Math.min(750,Math.max(320,Math.round(rect.width*.9))),targetHeight=Math.round(targetWidth*Math.min(1.0,rect.height/Math.max(1,rect.width)));const w=targetWidth,h=Math.max(250,targetHeight);
if(canvas.width!==w||canvas.height!==h){canvas.width=w;canvas.height=h}
const image=ctx.createImageData(w,h),data=image.data,zbuf=new Float32Array(w*h);
const cp=Math.cos(pitch), eye=[radius*Math.sin(yaw)*cp,.9+radius*Math.sin(pitch),radius*Math.cos(yaw)*cp],origin=[0,.9,0];
const forward=normalized(diff(origin,eye)),right=normalized(cross(forward,[0,1,0])),up=cross(right,forward),scale=1/Math.tan(35*Math.PI/360),unit=h*scale/2;
for(let y=0;y<h;y++){let t=y/h;let bg=[24+7*t,33+5*t,44+6*t];for(let x=0;x<w;x++){let off=(y*w+x)*4;data[off]=bg[0];data[off+1]=bg[1];data[off+2]=bg[2];data[off+3]=255}}
const pr=p=>{let d=diff(p,eye),depth=d[0]*forward[0]+d[1]*forward[1]+d[2]*forward[2];if(depth<.035)return null;return [w/2+(d[0]*right[0]+d[1]*right[1]+d[2]*right[2])*unit/depth,h/2-(d[0]*up[0]+d[1]*up[1]+d[2]*up[2])*unit/depth,1/depth]};
const light=normalized(matLight),fill=normalized(matFill),temp=geometry;
for(let a=0;a<temp.length;a+=27){
 const A=pr([temp[a],temp[a+1],temp[a+2]]),B=pr([temp[a+9],temp[a+10],temp[a+11]]),C=pr([temp[a+18],temp[a+19],temp[a+20]]);
 if(!A||!B||!C)continue;
 const n=[temp[a+3],temp[a+4],temp[a+5]], direct=Math.max(0,n[0]*light[0]+n[1]*light[1]+n[2]*light[2]),fillValue=Math.max(0,n[0]*fill[0]+n[1]*fill[1]+n[2]*fill[2]);
 const shade=Math.min(1.2,.59+direct*.47+fillValue*.12);
 const rgb=[Math.min(255,Math.round(temp[a+6]*255*shade)),Math.min(255,Math.round(temp[a+7]*255*shade)),Math.min(255,Math.round(temp[a+8]*255*shade))];
 let minX=Math.max(0,Math.floor(Math.min(A[0],B[0],C[0]))),maxX=Math.min(w-1,Math.ceil(Math.max(A[0],B[0],C[0]))),minY=Math.max(0,Math.floor(Math.min(A[1],B[1],C[1]))),maxY=Math.min(h-1,Math.ceil(Math.max(A[1],B[1],C[1])));
 if(minX>maxX||minY>maxY)continue;
 const edge=(a,b,x,y)=>(x-a[0])*(b[1]-a[1])-(y-a[1])*(b[0]-a[0]);
 const area=edge(A,B,C[0],C[1]);if(Math.abs(area)<.0001)continue;const inv=1/area,sign=area>0?1:-1;
 for(let y=minY;y<=maxY;y++){for(let x=minX;x<=maxX;x++){const X=x+.5,Y=y+.5,w0=edge(B,C,X,Y),w1=edge(C,A,X,Y),w2=edge(A,B,X,Y);
 if(w0*sign<0||w1*sign<0||w2*sign<0)continue;const zz=(w0*A[2]+w1*B[2]+w2*C[2])*inv,idx=y*w+x;if(zz<=zbuf[idx])continue;zbuf[idx]=zz;const k=idx*4;data[k]=rgb[0];data[k+1]=rgb[1];data[k+2]=rgb[2];}}
}
ctx.putImageData(image,0,0);
}
const presets={three:[2.525,.22,5.25],side:[Math.PI/2,.12,5.1],front:[Math.PI,.12,5.15],rear:[0,.12,5.15]};
root.querySelectorAll('[data-model]').forEach(b=>b.addEventListener('click',()=>build(b.dataset.model)));
root.querySelectorAll('[data-view]').forEach(b=>b.addEventListener('click',()=>{[yaw,pitch,radius]=presets[b.dataset.view];draw()}));
let dirty=false;const schedule=()=>{if(dirty)return;dirty=true;requestAnimationFrame(()=>{dirty=false;draw()})};
canvas.addEventListener('pointerdown',e=>{drag=true;lastX=e.clientX;lastY=e.clientY;canvas.setPointerCapture(e.pointerId)});
canvas.addEventListener('pointermove',e=>{if(!drag)return;yaw-=(e.clientX-lastX)*.009;pitch=Math.max(-.65,Math.min(1.32,pitch+(e.clientY-lastY)*.007));lastX=e.clientX;lastY=e.clientY;schedule()});
canvas.addEventListener('pointerup',()=>drag=false);canvas.addEventListener('pointercancel',()=>drag=false);
canvas.addEventListener('wheel',e=>{e.preventDefault();radius=Math.max(2.7,Math.min(14,radius*Math.exp(e.deltaY*.001)));schedule()},{passive:false});
new ResizeObserver(schedule).observe(canvas);
try{build('v6')}catch(e){label.textContent='Unable to render SC3D: '+e.message}
})();
</script>
