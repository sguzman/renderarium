format: scenarium-sc3d-scene-assembly
version: "0.1"
id: block-chibi-factory-v1
name: Block Chibi Toy-Block Factory v1
description: >-
  Cute compact toy-block forming and packaging cell: incoming stock bin
  feeds a tilted chute into one continuous horizontal conveyor; a supported
  pastel stamping press forms blocks; a mint and rose pick-and-place robot
  operates alongside; an inspection gate checks pieces; finished cartons
  are collected on a shipping pallet near output; background supply shelving,
  a safety control console and a marked worker walkway complete the cell.
