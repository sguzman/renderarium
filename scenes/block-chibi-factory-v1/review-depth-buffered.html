   const projected=poly.map(([x,y,z])=>[ww/2+x*focal/z,hh/2-y*focal/z,z]);
   for(let k=1;k+1<projected.length;k++)raster(projected[0],projected[k],projected[k+1],rgb);
  }
  ctx.putImageData(fb,0,0);
 };
}
// Invalidate once per animation frame, rather than racing against pointer events.
let queued=false;
function redraw(){if(queued)return;queued=true;requestAnimationFrame(()=>{queued=false;try{draw()}catch(e){error.style.display='block';error.textContent=e.message}});}
const pointers=new Map();let pinch=null;
canvas.addEventListener('pointerdown',e=>{canvas.setPointerCapture(e.pointerId);pointers.set(e.pointerId,[e.clientX,e.clientY]);pinch=null;canvas.style.cursor='grabbing'});
canvas.addEventListener('pointermove',e=>{
 if(!pointers.has(e.pointerId))return;
 const prev=pointers.get(e.pointerId);pointers.set(e.pointerId,[e.clientX,e.clientY]);
 if(pointers.size===1){az+=(e.clientX-prev[0])*.008;el=clamp(el+(e.clientY-prev[1])*.006,.08,1.49);}
 else if(pointers.size===2){const[a,b]=[...pointers.values()],d=Math.hypot(a[0]-b[0],a[1]-b[1]);if(pinch&&d)dist=clamp(dist*pinch/d,5,35);pinch=d;}
 redraw();
});
const release=e=>{pointers.delete(e.pointerId);pinch=null;if(!pointers.size)canvas.style.cursor='grab'};
canvas.addEventListener('pointerup',release);canvas.addEventListener('pointercancel',release);
canvas.addEventListener('wheel',e=>{e.preventDefault();dist=clamp(dist*Math.exp(e.deltaY*.001),5,35);redraw()},{passive:false});
host.querySelector('#fp-reset').addEventListener('click',()=>{az=.6;el=.56;dist=18.3;target=[0,1.65,.1];redraw()});
host.querySelector('#fp-top').addEventListener('click',()=>{az=.22;el=1.42;dist=18;redraw()});
host.querySelector('#fp-line').addEventListener('click',()=>{az=.12;el=.32;dist=15;redraw()});
host.querySelector('#fp-walls').addEventListener('change',build);
host.querySelector('#fp-products').addEventListener('change',build);
if(typeof ResizeObserver!=='undefined')new ResizeObserver(redraw).observe(canvas);
build();

}catch(e){error.textContent=e.stack||e.message;error.style.display='block';status.textContent='Error';}
})();
