name: Canonical chat preview integration (public runners)

# Public mirror only. Run on changes to this repository, never the private source.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: renderarium-canonical-chat-${{ github.ref }}
  cancel-in-progress: true

jobs:
  canonical:
    name: Frozen sources / Node / Ajv / production Three.js
    if: ${{ github.event.repository.private == false }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Enforce public publication boundary
        run: node tools/publication-gate.mjs
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check Backyard full-effects benchmark provenance and syntax
        run: node scripts/check-backyard-effects-benchmark-v2.mjs
      - name: Install pnpm via Corepack
        run: |
          corepack enable
          corepack pnpm --version
      - name: Install declared dependencies
        run: corepack pnpm install --frozen-lockfile
      - name: Execute real 18-stage canonical pipeline
        shell: bash
        run: |
          mkdir -p artifacts/canonical-chat
          set -o pipefail
          node scripts/verify-chat-preview-pipeline.mjs 2>&1 | tee artifacts/canonical-chat/verification.log
      - name: Upload canonical pipeline evidence even on failure
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: canonical-chat-verification
          path: artifacts/canonical-chat/
          if-no-files-found: warn

  interactive:
    name: Interactive seven-environment Three.js WebGL QA
    if: ${{ github.event.repository.private == false }}
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - name: Enforce public publication boundary
        run: node tools/publication-gate.mjs
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install pnpm via Corepack
        run: corepack enable
      - name: Install declared dependencies
        run: corepack pnpm install --frozen-lockfile
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Playwright and Chromium
        run: |
          python -m pip install playwright 'pillow>=12,<13'
          python -m playwright install --with-deps chromium
      - name: Verify Linux WebGL launcher argument validation
        run: |
          if node scripts/launch-environments.mjs --unknown; then
            echo "Unexpectedly accepted unsafe launcher argument"
            exit 1
          fi
      - name: Orbit and zoom real Three.js scene geometry in seven environments
        run: python scripts/test-block-chibi-environment-orbit.py --allow-swiftshader
      - name: Upload interactive environment QA even on failure
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: interactive-environment-qa
          path: artifacts/interactive-environments/
          if-no-files-found: warn

  vehicle-candidates:
    name: Separate SC3D vehicle prototypes and Chromium visual QA
    if: ${{ github.event.repository.private == false }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Enforce public publication boundary
        run: node tools/publication-gate.mjs
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install pnpm via Corepack
        run: corepack enable
      - name: Install declared dependencies
        run: corepack pnpm install --frozen-lockfile
      - name: Verify candidate vehicles with Ajv and SC3D semantic rules
        run: node scripts/test-vehicle-prototypes.mjs
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Playwright and Chromium
        run: |
          python -m pip install playwright 'pillow>=12,<13'
          python -m playwright install --with-deps chromium
      - name: Render candidate bicycles and cars through actual WebGL
        run: python scripts/capture-vehicle-prototypes.py
      - name: Exercise canonical interactive car version comparison in Chromium
        run: python scripts/test-vehicle-review-browser.py
      - name: Build offline canonical Three.js vehicle review
        run: node scripts/export-vehicle-review-html.mjs
      - name: Test offline canonical Three.js viewer in Chromium
        run: python scripts/test-offline-vehicle-review.py
      - name: Upload standalone canonical car review viewer
        uses: actions/upload-artifact@v4
        with:
          name: canonical-car-review-html
          path: artifacts/vehicle-review-qa/renderarium-canonical-car-review.html
          if-no-files-found: error
      - name: Upload independent vehicle candidate views
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: vehicle-prototype-qa
          path: artifacts/vehicle-prototype-qa/
          if-no-files-found: warn

  artifact-study:
    name: Overhead VSM floor artifact reproduction (real WebGL)
    if: ${{ github.event.repository.private == false }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Enforce public publication boundary
        run: node tools/publication-gate.mjs
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install pnpm via Corepack
        run: corepack enable
      - name: Install declared dependencies
        run: corepack pnpm install --frozen-lockfile
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Python Playwright and Chromium
        run: |
          python -m pip install playwright 'pillow>=12,<13'
          python -m playwright install --with-deps chromium
      - name: Render near-vertical sun plus VSM bias variants
        run: |
          python scripts/capture-lighting-shadow-gallery.py --self-test
          python scripts/capture-lighting-shadow-gallery.py --study floor --allow-swiftshader --output-dir artifacts/floor-artifact-study
      - name: Upload real floor artifact studies
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: floor-artifact-study
          path: artifacts/floor-artifact-study/
          if-no-files-found: warn

  chromium:
    name: Canonical Three.js / Chromium WebGL browser QA
    if: ${{ github.event.repository.private == false }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Enforce public publication boundary
        run: node tools/publication-gate.mjs
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install pnpm via Corepack
        run: corepack enable
      - name: Install declared dependencies
        run: corepack pnpm install --frozen-lockfile
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Python Playwright and Chromium
        run: |
          python -m pip install playwright 'pillow>=12,<13'
          python -m playwright install --with-deps chromium
      - name: Test all seven Backyard effects profiles in Chromium (software WebGL only)
        run: python scripts/test-backyard-effects-benchmark-browser.py --allow-swiftshader --output-dir artifacts/backyard-effects-v2
      - name: Upload Backyard full-effects browser QA evidence even on failure
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: backyard-effects-v2-browser
          path: artifacts/backyard-effects-v2/
          if-no-files-found: ignore
      - name: Verify canonical preview HTTP entrypoints
        run: node scripts/test-block-chibi-canonical-preview-server.mjs
      - name: Exercise actual browser scene controls for seven accepted scenes
        shell: bash
        run: |
          mkdir -p artifacts/canonical-browser
          set -o pipefail
          {
            for scene in living-room kitchen bathroom office backyard garage factory; do
              echo "===== ${scene} ====="
              python scripts/test-block-chibi-canonical-browser.py --scene "${scene}" --allow-swiftshader --report-json "artifacts/canonical-browser/${scene}.json"
            done
          } 2>&1 | tee artifacts/canonical-browser/browser-tests.log
      - name: Capture seven actual scene lighting and shadow comparison sheets
        shell: bash
        run: |
          mkdir -p artifacts/lighting-shadow-gallery
          python scripts/capture-lighting-shadow-gallery.py --self-test
          set -o pipefail
          python scripts/capture-lighting-shadow-gallery.py --allow-swiftshader --output-dir artifacts/lighting-shadow-gallery 2>&1 | tee artifacts/lighting-shadow-gallery/gallery.log
      - name: Capture seven shadow bias and blur studies
        shell: bash
        run: |
          mkdir -p artifacts/shadow-study
          set -o pipefail
          python scripts/capture-lighting-shadow-gallery.py --study shadow --allow-swiftshader --output-dir artifacts/shadow-study 2>&1 | tee artifacts/shadow-study/shadow-study.log
      - name: Benchmark eleven optional renderer modes on seven frozen scenes
        shell: bash
        run: |
          mkdir -p artifacts/renderer-costs
          python scripts/benchmark-renderer-quality.py --self-test
          set -o pipefail
          python scripts/benchmark-renderer-quality.py --allow-swiftshader --output-dir artifacts/renderer-costs 2>&1 | tee artifacts/renderer-costs/benchmark.log
      - name: Upload browser diagnostics even on failure
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: canonical-threejs-browser
          path: artifacts/canonical-browser/
          if-no-files-found: warn
      - name: Upload renderer cost comparisons even on failure
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: renderer-costs
          path: artifacts/renderer-costs/
          if-no-files-found: warn
      - name: Upload actual scene lighting and shadow gallery even on failure
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: lighting-shadow-gallery
          path: artifacts/lighting-shadow-gallery/
          if-no-files-found: warn
      - name: Upload shadow bias and blur studies even on failure
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: shadow-study
          path: artifacts/shadow-study/
          if-no-files-found: warn

# This CI checks real canonical source/Three.js and Chromium behavior.
# SwiftShader software WebGL is not physical GPU evidence; no live ChatGPT
# embed delivery or new human visual approval is claimed.
