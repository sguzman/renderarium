format: scenarium-constructive-3d
version: "0.1"

units: meters

coordinates:
  handedness: right
  up: y
  forward: -z

requires:
  - core.primitives
  - core.rigid-hierarchy

materials:
  cream:
    role: pillow-textile
    base_color: "#f2dfcf"
    roughness: 0.99
  cream_light:
    role: pillow-textile-highlight
    base_color: "#f8eadf"
    roughness: 0.99
  rose:
    role: pillow-textile
    base_color: "#d98aa2"
    roughness: 0.99
  rose_light:
    role: pillow-textile-highlight
    base_color: "#efb4c5"
    roughness: 0.99
  mauve:
    role: pillow-textile
    base_color: "#b7768f"
    roughness: 0.99
  mauve_light:
    role: pillow-textile-highlight
    base_color: "#d4a1b2"
    roughness: 0.99

asset:
  id: block-chibi-square-throw-pillow-v1
  name: Block Chibi Square Throw Pillow v1
  kind: prop
  root: root
  tags: [pillow, block-chibi-room, throw-pillow, grammar-specimen]

parts:
  root: {role: pillow-root, parent: null, articulation: static}

  body:
    role: pillow-cushion-mass
    parent: root
    geometry: {kind: cuboid, size: [0.72, 0.24, 0.72]}
    material: rose
    transform: {translate: [0.0, 0.12, 0.0]}

  center_panel:
    role: pillow-puff-panel
    parent: root
    geometry: {kind: cuboid, size: [0.52, 0.055, 0.52]}
    material: rose_light
    transform: {translate: [0.0, 0.2675, 0.0]}

extensions:
  taria:
    object_grammar: pillow@0.1
    style_grammar: block-chibi-room@0.1
    realization_grammar: block-chibi-room::pillow@0.1
    specimen_intent: square-throw-pillow
    render_shading: flat
    evaluation_status: awaiting-family-review
