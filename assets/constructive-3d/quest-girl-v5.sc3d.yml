extensions:
  taria:
    visual_language_target: style-target:block-chibi-quest
    style_exemplar: Pokemon Quest
    experiment_phase: static-beauty-v5
    predecessor: quest-girl-v4
    acceptance_gate: human-static-aesthetic-review
    evaluation_status: retained-clear-improvement
    evaluation_result: partial-aesthetic-pass
    evaluated_at: 2026-10-04
    human_review_summary: >-
      v5 is much better overall. Sideburns improved but remain sideburn-like.
      The detached forehead-lock strategy is rejected: front hair pieces still
      look strange because they do not read as one continuous hairstyle body.
      The next iteration must make the front fringe visibly root-connected to
      the main crown/front hair mass.
    next_target: quest-girl-v6
    hair_grammar: block-chibi-hair-grammar@0.1
    hair_archetype: soft-full-bangs-ponytail
    design_intent:
      - preserve-successful-face
      - formal-hair-grammar-conformance
      - no-continuous-fringe-bar
      - wide-root-narrow-tip-bang-clumps
      - high-side-plane-temple-transitions
      - side-masses-behind-face-plane
      - full-crown-back-coverage
      - visibly-connected-rear-ponytail
      - minimize-visible-neck
      - non-sexualized-cute-anime
