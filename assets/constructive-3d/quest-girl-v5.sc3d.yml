format: scenarium-constructive-3d
version: "0.1"

units: meters

coordinates:
  handedness: right
  up: y
  forward: -z

asset:
  id: quest-girl-v5
  name: Quest Girl v5
  kind: character
  root: root
  description: >-
    Fifth SC3D block-chibi girl candidate. Hair is authored against the
    formal BlockChibiHairGrammar and the selected soft-full-bangs-ponytail
    archetype. The face, body, and clothing are intentionally frozen.
  tags:
    - block-chibi
    - pokemon-quest-target
    - cute-girl
    - static-beauty-proof
    - v5

requires:
  - core.primitives
  - core.rigid-hierarchy

parameters:
