format: scenarium-constructive-3d
version: "0.1"

units: meters

coordinates:
  handedness: right
  up: y
  forward: -z

requires:
  - core.primitives
  - core.rigid-hierarchy

materials:
  pink:
    role: lamp-housing
    base_color: "#d7869f"
    roughness: 0.96
  pink_light:
    role: lamp-housing-accent
    base_color: "#e39bb2"
    roughness: 0.96
  pink_dark:
    role: lamp-support
    base_color: "#9f586f"
    roughness: 0.97
  warm_emit:
    role: lamp-emitter
    base_color: "#fff0b8"
    roughness: 0.45
    emissive: "#ffd56f"
    emissive_intensity: 2.5
  brown:
    role: lamp-support
    base_color: "#6b4a3d"
    roughness: 0.97

asset:
  id: block-chibi-cozy-table-lamp-v1.1
  name: Block Chibi Cozy Table Lamp v1.1
  kind: prop
  root: root
  tags: [lamp, block-chibi-room, table-lamp, grammar-specimen, review-corrected]

parts:
  root: {role: lamp-root, parent: null, articulation: static}

  base:
    role: lamp-base
    parent: root
    geometry:
      kind: tapered_box
      bottom: [0.58, 0.58]
      top: [0.46, 0.46]
      height: 0.20
    material: pink_dark
    transform: {translate: [0.0, 0.10, 0.0]}

  stem:
    role: lamp-stem
    parent: root
    geometry: {kind: cuboid, size: [0.13, 0.44, 0.13]}
    material: brown
    transform: {translate: [0.0, 0.41, 0.0]}

  emitter:
    role: lamp-light-source
    parent: root
    geometry: {kind: cuboid, size: [0.38, 0.12, 0.38]}
    material: warm_emit
    transform: {translate: [0.0, 0.62, 0.0]}

  shade:
    role: lamp-shade
    parent: root
    geometry:
      kind: tapered_box
      bottom: [0.76, 0.76]
      top: [0.50, 0.50]
      height: 0.42
    material: pink
    transform: {translate: [0.0, 0.83, 0.0]}

extensions:
  taria:
    object_grammar: lamp@0.1
    style_grammar: block-chibi-room@0.1
    realization_grammar: block-chibi-room::lamp@0.2
    predecessor: block-chibi-cozy-table-lamp-v1
    specimen_intent: cozy-table-lamp
    support_strategy: table
    proof_light_intensity: strong-visible
    evaluation_status: awaiting-corrected-family-review
