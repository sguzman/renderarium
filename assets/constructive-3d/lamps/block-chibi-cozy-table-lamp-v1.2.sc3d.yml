format: scenarium-constructive-3d
version: "0.1"

units: meters

coordinates:
  handedness: right
  up: y
  forward: -z

requires:
  - core.primitives
  - core.rigid-hierarchy

materials:
  pink:
    role: lamp-housing
    base_color: "#d7869f"
    roughness: 0.98
  pink_light:
    role: lamp-housing-accent
    base_color: "#e39bb2"
    roughness: 0.98
  pink_dark:
    role: lamp-support
    base_color: "#9f586f"
    roughness: 0.98
  brown:
    role: lamp-support
    base_color: "#6b4a3d"
    roughness: 0.98
  warm_emit_on:
    role: lamp-emitter-powered
    base_color: "#fff0b8"
    roughness: 0.82
    emissive: "#ffd56f"
    emissive_intensity: 2.8
  warm_emit_off:
    role: lamp-emitter-unpowered
    base_color: "#d8c79d"
    roughness: 0.98
    emissive: "#000000"
    emissive_intensity: 0.0

asset:
  id: block-chibi-cozy-table-lamp-v1.2
  name: Block Chibi Cozy Table Lamp v1.2
  kind: prop
  root: root
  tags: [lamp, block-chibi-room, table-lamp, grammar-specimen, shading-power-corrected]

parts:
  root: {role: lamp-root, parent: null, articulation: static}

  base:
    role: lamp-base
    parent: root
    geometry:
      kind: tapered_box
      bottom: [0.58, 0.58]
      top: [0.46, 0.46]
      height: 0.20
    material: pink_dark
    transform: {translate: [0.0, 0.10, 0.0]}

  stem:
    role: lamp-stem
    parent: root
    geometry: {kind: cuboid, size: [0.13, 0.44, 0.13]}
    material: brown
    transform: {translate: [0.0, 0.41, 0.0]}

  emitter:
    role: lamp-light-source
    parent: root
    geometry: {kind: cuboid, size: [0.38, 0.10, 0.38]}
    material: warm_emit_on
    transform: {translate: [0.0, 0.59, 0.0]}

  shade:
    role: lamp-shade
    parent: root
    geometry:
      kind: tapered_box
      bottom: [0.76, 0.76]
      top: [0.50, 0.50]
      height: 0.42
    material: pink
    transform: {translate: [0.0, 0.83, 0.0]}

extensions:
  taria:
    object_grammar: lamp@0.2
    style_grammar: block-chibi-room@0.1
    realization_grammar: block-chibi-room::lamp@0.3
    predecessor: block-chibi-cozy-table-lamp-v1.1
    specimen_intent: cozy-table-lamp
    support_strategy: table
    render_shading: flat
    emission_direction_local: [0.0, -1.0, 0.0]
    power_states:
      on: {emitter_material: warm_emit_on, local_light: enabled}
      off: {emitter_material: warm_emit_off, local_light: disabled}
    evaluation_status: awaiting-v1.2-family-review
