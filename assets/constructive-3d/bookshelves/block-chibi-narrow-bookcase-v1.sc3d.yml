    transform: {translate: [0.0, 0.06, 0.0]}

  shelf_mid_1:
    role: shelf-board
    parent: root
    geometry: {kind: cuboid, size: [0.68, 0.12, 0.38]}
    material: wood
    transform: {translate: [0.0, 0.46, 0.0]}

  shelf_mid_2:
    role: shelf-board
    parent: root
    geometry: {kind: cuboid, size: [0.68, 0.12, 0.38]}
