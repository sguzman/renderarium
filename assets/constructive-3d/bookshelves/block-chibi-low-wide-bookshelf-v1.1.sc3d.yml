format: scenarium-constructive-3d
version: "0.1"

units: meters

coordinates:
  handedness: right
  up: y
  forward: -z

requires:
  - core.primitives
  - core.rigid-hierarchy

materials:
  wood:
    role: furniture-primary
    base_color: "#7b5545"
    roughness: 0.95
  wood_dark:
    role: furniture-secondary
    base_color: "#5c3d35"
    roughness: 0.96
  book_blue:
    role: book
    base_color: "#708aa0"
    roughness: 0.96
  book_gold:
    role: book
    base_color: "#c39a57"
    roughness: 0.96
  book_pink:
    role: book
    base_color: "#d7869f"
    roughness: 0.98
  box_cream:
    role: storage-box
    base_color: "#f1cdd8"
    roughness: 0.98

asset:
  id: block-chibi-low-wide-bookshelf-v1.1
  name: Block Chibi Low Wide Bookshelf v1.1
  kind: prop
  root: root
  tags: [bookshelf, block-chibi-room, low-wide-bookshelf, grammar-specimen]

parts:
  root: {role: bookshelf-root, parent: null, articulation: static}

  side_left:
    role: bookshelf-support
    parent: root
    geometry: {kind: cuboid, size: [0.16, 0.92, 0.48]}
    material: wood_dark
    transform: {translate: [-0.70, 0.46, 0.0]}

  side_right:
    role: bookshelf-support
    parent: root
    geometry: {kind: cuboid, size: [0.16, 0.92, 0.48]}
    material: wood_dark
    transform: {translate: [0.70, 0.46, 0.0]}

  shelf_bottom:
    role: shelf-board
    parent: root
    geometry: {kind: cuboid, size: [1.22, 0.14, 0.48]}
    material: wood
    transform: {translate: [0.0, 0.07, 0.0]}

  shelf_mid:
    role: shelf-board
    parent: root
    geometry: {kind: cuboid, size: [1.22, 0.14, 0.48]}
    material: wood
    transform: {translate: [0.0, 0.50, 0.0]}

  shelf_top:
    role: shelf-board
    parent: root
    geometry: {kind: cuboid, size: [1.22, 0.14, 0.48]}
    material: wood
    transform: {translate: [0.0, 0.85, 0.0]}

  storage_box:
    role: shelf-content
    parent: root
    geometry: {kind: cuboid, size: [0.48, 0.28, 0.34]}
    material: box_cream
    transform: {translate: [-0.34, 0.28, 0.0]}

  book_1:
    role: shelf-content
    parent: root
    geometry: {kind: cuboid, size: [0.15, 0.25, 0.28]}
    material: book_blue
    transform: {translate: [0.18, 0.27, 0.0]}

  book_2:
    role: shelf-content
    parent: root
    geometry: {kind: cuboid, size: [0.15, 0.31, 0.28]}
    material: book_pink
    transform: {translate: [0.35, 0.30, 0.0]}

  book_3:
    role: shelf-content
    parent: root
    geometry: {kind: cuboid, size: [0.15, 0.27, 0.28]}
    material: book_gold
    transform: {translate: [0.52, 0.28, 0.0]}

extensions:
  taria:
    object_grammar: bookshelf@0.1
    style_grammar: block-chibi-room@0.1
    realization_grammar: block-chibi-room::bookshelf@0.2
    specimen_intent: low-wide-bookshelf
    access_forward: [0.0, 0.0, -1.0]
    evaluation_status: awaiting-corrected-family-review

    correction:
      predecessor: block-chibi-low-wide-bookshelf-v1
      shelf_joint_strategy: fit-between-uprights
      inner_clear_span: 1.24
      shelf_width: 1.22
      side_clearance_each: 0.01
