    room_grammar: block-chibi-room-grammar@0.2
    room_archetype: cozy-bedroom-study@0.2
    experiment_phase: assembly-cleanup-v2
    predecessor: cozy-block-room-v1
    character_stage:
      center: [0.05, -0.92, -0.05]
      clear_radius: 0.82
    zones:
      sleep: right-rear
      study: left-rear
      storage: back-left-wall
      display: back-wall
      plant: right-front
      character-stage: center-front
    cleanup:
      bed_enlarged_for_sleep_use: true
      pillow_moved_to_head_side: true
      plant_separated_from_bed: true
      desk_supports: four-leg
      shelf_wall_adjacent: true
      shell_floor_penetration_reduced: true
      chair_shelf_collision_removed: true
    acceptance_gate: human-environment-assembly-review
    evaluation_status: awaiting-review
