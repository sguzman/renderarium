format: scenarium-constructive-3d
version: "0.1"

units: meters

coordinates:
  handedness: right
  up: y
  forward: -z

asset:
  id: cozy-block-room-v2
  name: Cozy Block Room v2
  kind: environment
  root: root
  description: >-
    Second SC3D environment specimen: a strict assembly-cleanup revision of
    the accepted v1 composition, built against BlockChibiRoomGrammar v0.2.
  tags:
    - block-chibi
    - toy-diorama
    - bedroom
    - study
    - assembly-cleanup-v2

