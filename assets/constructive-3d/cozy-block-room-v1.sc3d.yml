format: scenarium-constructive-3d
version: "0.1"

units: meters

coordinates:
  handedness: right
  up: y
  forward: -z

asset:
  id: cozy-block-room-v1
  name: Cozy Block Room v1
  kind: environment
  root: root
  description: >-
    First reusable SC3D environment specimen: an open-front block-chibi bedroom
    and study room built against BlockChibiRoomGrammar v0.1.
  tags:
    - block-chibi
    - toy-diorama
    - bedroom
    - study
    - first-environment-proof

