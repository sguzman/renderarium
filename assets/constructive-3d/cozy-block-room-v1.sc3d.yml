extensions:
  taria:
    room_grammar: block-chibi-room-grammar@0.1
    room_archetype: cozy-bedroom-study@0.1
    experiment_phase: first-environment-proof
    character_stage:
      center: [0.05, -0.92, -0.05]
      clear_radius: 0.82
    zones:
      sleep: right-rear
      study: left-rear
      storage: left-rear-wall
      display: back-wall
      character-stage: center-front
    acceptance_gate: human-environment-aesthetic-review
    evaluation_status: composition-pass-assembly-cleanup-required
    evaluation_result: retained-first-environment-proof
    evaluated_at: 2026-10-04
    human_review_summary: >-
      Overall room setup is liked and retained. Window, rug, walls, floor, and
      general composition pass. Bed is mostly good but underscaled for intended
      sleep use; pillow is on the wrong end; plant placement makes foliage read
      as part of the bed; desk support logic is incomplete; bookcase should sit
      against the wall; and multiple shell/furniture intersections become
      visible when the camera moves.
    next_target: cozy-block-room-v2
