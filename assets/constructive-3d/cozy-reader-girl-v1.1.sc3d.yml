      purpose: design-language-only
    design_intent:
      - much-cuter-than-quest-girl-v7
      - larger-head-smaller-body
      - softer-fuller-hair
      - face-framing-side-locks
      - simpler-sweeter-face
      - slimmer-limbs
      - chunky-cute-boots
      - pink-lavender-cozy-palette
      - standing-static-proof-before-seated-reading
