format: scenarium-constructive-3d
version: "0.1"

units: meters

coordinates:
  handedness: right
  up: y
  forward: -z

requires:
  - core.primitives
  - core.rigid-hierarchy

materials:
  wood:
    role: frame
    base_color: "#7b5545"
    roughness: 0.95
  wood_dark:
    role: frame-secondary
    base_color: "#5c3d35"
    roughness: 0.96
  cream:
    role: mattress
    base_color: "#f5e6d5"
    roughness: 0.98
  textile:
    role: blanket
    base_color: "#d7869f"
    roughness: 0.98
  textile_light:
    role: pillow
    base_color: "#f1cdd8"
    roughness: 0.98

asset:
  id: block-chibi-compact-cozy-bed-v1
  name: Block Chibi Compact Cozy Bed v1
  kind: prop
  root: root
  tags: [bed, block-chibi-room, compact-cozy-bed, grammar-specimen]

parts:
  root: {role: bed-root, parent: null, articulation: static}

  base:
    role: bed-support
    parent: root
    geometry: {kind: cuboid, size: [0.96, 0.30, 1.62]}
    material: wood
    transform: {translate: [0.0, 0.15, 0.0]}

  mattress:
    role: bed-mattress
    parent: root
    geometry: {kind: cuboid, size: [0.90, 0.20, 1.54]}
    material: cream
    transform: {translate: [0.0, 0.40, 0.0]}

  headboard:
    role: bed-headboard
    parent: root
    geometry: {kind: cuboid, size: [1.00, 0.64, 0.16]}
    material: wood_dark
    transform: {translate: [0.0, 0.50, 0.73]}

  pillow:
    role: bed-pillow
    parent: root
    geometry: {kind: cuboid, size: [0.54, 0.18, 0.34]}
    material: textile_light
    transform: {translate: [0.0, 0.58, 0.46]}

  blanket:
    role: bed-blanket
    parent: root
    geometry: {kind: cuboid, size: [0.91, 0.08, 0.68]}
    material: textile
    transform: {translate: [0.0, 0.54, -0.34]}

extensions:
  taria:
    object_grammar: bed@0.1
    style_grammar: block-chibi-room@0.1
    realization_grammar: block-chibi-room::bed@0.1
    specimen_intent: compact-cozy-bed
    head_direction: [0.0, 0.0, 1.0]
    evaluation_status: awaiting-family-review
