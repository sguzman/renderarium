format: scenarium-constructive-3d
version: "0.1"

units: meters

coordinates:
  handedness: right
  up: y
  forward: -z

asset:
  id: quest-girl-v3
  name: Quest Girl v3
  kind: character
  root: root
  description: >-
    Third SC3D block-chibi girl candidate. This is a narrow cleanup of v2:
    side hair framing is reduced and pulled backward to remove the sideburn
    read, while the head is nestled lower into a simpler, softer collar area.
  tags:
    - block-chibi
    - pokemon-quest-target
    - cute-girl
    - static-beauty-proof
    - v3

requires:
  - core.primitives
  - core.rigid-hierarchy

parameters:
  head_width:
    type: number
    default: 1.18
    min: 1.00
    max: 1.40
    description: Chibi head width.

materials:
  skin:
    role: skin
    base_color: "#f3c9ae"
    roughness: 0.94

  hair:
    role: hair
    base_color: "#402536"
    roughness: 0.90

  hair_shadow:
    role: hair-shadow
    base_color: "#2f1c29"
    roughness: 0.92

  dress:
    role: costume-primary
    base_color: "#d77a9c"
    roughness: 0.92

  dress_dark:
    role: costume-secondary
    base_color: "#a44f72"
    roughness: 0.94

  cream:
    role: costume-trim
    base_color: "#f4e8d2"
    roughness: 0.96

  eye:
    role: facial-feature
    base_color: "#352635"
    roughness: 1.0

  eye_glint:
    role: facial-highlight
    base_color: "#fffaf1"
    roughness: 0.92

  blush:
    role: facial-accent
    base_color: "#e58c9c"
    roughness: 0.98

  shoe:
    role: footwear
    base_color: "#62404c"
    roughness: 0.94

geometry_library:
  eye_block:
    kind: cuboid
    size: [0.16, 0.21, 0.028]

  eye_glint:
    kind: cuboid
    size: [0.040, 0.050, 0.016]

  brow:
    kind: cuboid
    size: [0.15, 0.035, 0.020]

  hand:
    kind: cuboid
    size: [0.20, 0.18, 0.20]

