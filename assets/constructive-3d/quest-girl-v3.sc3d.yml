extensions:
  taria:
    visual_language_target: style-target:block-chibi-quest
    style_exemplar: Pokemon Quest
    experiment_phase: static-beauty-v3
    predecessor: quest-girl-v2
    acceptance_gate: human-static-aesthetic-review
    evaluation_status: failed-aesthetic-iteration
    evaluation_result: partial-local-improvement
    evaluated_at: 2026-10-04
    human_review_summary: >-
      Sideburn blocks were reduced, but the forehead hair still reads as ugly
      slab-like locks, the neck/collar transition remains unattractive, and a
      visible bald spot exposes insufficient hair coverage. Face features
      (eyebrows, eyes, mouth, blush) are retained as successful.
    next_target: quest-girl-v4
    design_intent:
      - preserve-v2-gains
      - eliminate-sideburn-read
      - smaller-backshifted-temple-hair
      - reduced-visible-neck
      - simplified-soft-collar
      - head-nestled-into-torso
      - non-sexualized-cute-anime
