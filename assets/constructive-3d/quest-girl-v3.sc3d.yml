    material: dress
    transform:
      translate: [0.0, 0.18, 0.0]
    anchors:
      neck: [0.0, 0.28, 0.0]
      shoulder_left: [-0.38, 0.13, 0.0]
      shoulder_right: [0.38, 0.13, 0.0]
      hip_left: [-0.24, -0.27, 0.0]
      hip_right: [0.24, -0.27, 0.0]
