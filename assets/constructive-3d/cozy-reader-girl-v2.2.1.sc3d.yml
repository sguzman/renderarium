extensions:
  taria:
    design_target: cozy-reader-girl-v2
    candidate: cozy-reader-girl-v2.2.1
    predecessor_relation: cleanup-after-v2.1-human-review
    predecessor_geometry_reused: selectively
    reference:
      kind: user-approved-multi-view-reference-set
      views: [front-three-quarter, front, side, rear-three-quarter]
      library_files:
        - image-gen-1(6).png
        - image-gen-2(6).png
        - image-gen-3(6).png
        - image-gen-4(3).png
      purpose: shape-costume-height-anatomy-and-hair-silhouette-authority
    frozen_from_v2_1:
      - total-height
      - head-body-ratio
      - torso-length
      - leg-length
    repair_targets:
      - remove-visible-geometry-interpenetration
      - eliminate-z-fighting-style-overlays
      - separate-bangs-from-face-surface
      - separate-face-locks-from-cheek-volume
      - simplify-rear-hair-strands
      - clean-hand-cuff-waist-silhouette
      - preserve-v2.1-height-and-anatomy
      - make-hair-read-as-one-coherent-style
    generation_policy: no-image-generation
    evaluation_status: awaiting-v2.2-static-review
