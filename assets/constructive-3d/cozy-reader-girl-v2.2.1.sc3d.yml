format: scenarium-constructive-3d
version: '0.1'
units: meters
coordinates:
  handedness: right
  up: y
  forward: -z

asset:
  id: cozy-reader-girl-v2.2.1
  name: Cozy Reader Girl v2.2.1
  kind: character
  root: root
  description: >-
    Geometry-cleanup and hair-coherence repair after the v2.1 human review. The v2.1
    height and anatomy are intentionally frozen. v2.2 removes collision-prone overlays,
    separates face hair from skin, simplifies the rear hairstyle into spaced authored
    strands, and cleans the hand/waist silhouette without reopening body proportions.
  tags:
    - cute-character
    - cozy-reader
    - reference-derived
    - static-design-proof
    - anatomy-repair
    - hair-repair
    - v2.2
    - geometry-cleanup
    - hair-coherence

