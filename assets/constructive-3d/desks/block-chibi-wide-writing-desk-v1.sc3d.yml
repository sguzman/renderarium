    transform: {translate: [-0.69, 0.36, 0.02]}

  side_panel_right:
    role: desk-support
    parent: root
    geometry: {kind: cuboid, size: [0.18, 0.72, 0.62]}
    material: wood_dark
    transform: {translate: [0.69, 0.36, 0.02]}

  center_drawer:
    role: desk-drawer
    parent: root
    geometry: {kind: cuboid, size: [0.58, 0.18, 0.18]}
    material: wood_dark
    transform: {translate: [0.0, 0.64, -0.25]}

  drawer_face:
    role: desk-drawer-accent
    parent: root
    geometry: {kind: cuboid, size: [0.48, 0.11, 0.025]}
    material: cream
    transform: {translate: [0.0, 0.64, -0.352]}

extensions:
  taria:
    object_grammar: desk@0.1
    style_grammar: block-chibi-room@0.1
    realization_grammar: block-chibi-room::desk@0.1
    specimen_intent: wide-writing-desk
    use_forward: [0.0, 0.0, -1.0]
    evaluation_status: awaiting-family-review
