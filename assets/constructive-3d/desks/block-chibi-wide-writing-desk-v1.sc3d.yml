format: scenarium-constructive-3d
version: "0.1"

units: meters

coordinates:
  handedness: right
  up: y
  forward: -z

requires:
  - core.primitives
  - core.rigid-hierarchy

materials:
  wood:
    role: furniture-primary
    base_color: "#7b5545"
    roughness: 0.95
  wood_dark:
    role: furniture-secondary
    base_color: "#5c3d35"
    roughness: 0.96
  cream:
    role: furniture-accent
    base_color: "#f4e8d2"
    roughness: 0.98

asset:
  id: block-chibi-wide-writing-desk-v1
  name: Block Chibi Wide Writing Desk v1
  kind: prop
  root: root
  tags: [desk, block-chibi-room, wide-writing-desk, grammar-specimen]

parts:
  root: {role: desk-root, parent: null, articulation: static}

  top:
    role: desk-work-surface
    parent: root
    geometry: {kind: cuboid, size: [1.65, 0.16, 0.72]}
    material: wood
    transform: {translate: [0.0, 0.78, 0.0]}

  side_panel_left:
    role: desk-support
    parent: root
    geometry: {kind: cuboid, size: [0.18, 0.72, 0.62]}
