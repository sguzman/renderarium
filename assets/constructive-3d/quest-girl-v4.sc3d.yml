    role: skin
    base_color: "#f3c9ae"
    roughness: 0.94

  hair:
    role: hair
    base_color: "#402536"
    roughness: 0.90

  hair_shadow:
    role: hair-shadow
    base_color: "#2f1c29"
    roughness: 0.92

  dress:
    role: costume-primary
    base_color: "#d77a9c"
    roughness: 0.92

  dress_dark:
    role: costume-secondary
    base_color: "#a44f72"
    roughness: 0.94

  cream:
    role: costume-trim
    base_color: "#f4e8d2"
    roughness: 0.96

  eye:
    role: facial-feature
    base_color: "#352635"
    roughness: 1.0

  eye_glint:
    role: facial-highlight
    base_color: "#fffaf1"
    roughness: 0.92

  blush:
