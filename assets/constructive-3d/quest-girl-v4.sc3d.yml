format: scenarium-constructive-3d
version: "0.1"

units: meters

coordinates:
  handedness: right
  up: y
  forward: -z

asset:
  id: quest-girl-v4
  name: Quest Girl v4
  kind: character
  root: root
  description: >-
    Fourth SC3D block-chibi girl candidate. This iteration changes the hair
    construction strategy: a continuous front fringe base plus thinner
    overlapping bang pieces, fuller crown/side/back coverage, and a larger
    coherent ponytail mass. The visible neck is minimized further.
  tags:
    - block-chibi
    - pokemon-quest-target
    - cute-girl
    - static-beauty-proof
    - v4

requires:
  - core.primitives
  - core.rigid-hierarchy

parameters:
  head_width:
    type: number
    default: 1.18
    min: 1.00
    max: 1.40
    description: Chibi head width.

