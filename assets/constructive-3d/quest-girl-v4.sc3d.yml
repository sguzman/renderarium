extensions:
  taria:
    visual_language_target: style-target:block-chibi-quest
    style_exemplar: Pokemon Quest
    experiment_phase: static-beauty-v4
    predecessor: quest-girl-v3
    acceptance_gate: human-static-aesthetic-review
    evaluation_status: retained-hair-improvement-with-failures
    evaluation_result: partial-aesthetic-pass
    evaluated_at: 2026-10-04
    human_review_summary: >-
      Hair volume improved, but the result remains clumsy. The front fringe
      reads as a monobrow-like dark bar, a side mass still reads as a sideburn,
      and hair remains the dominant aesthetic bottleneck. Face, body, clothing,
      mouth, eyes, eyebrows, and blush are otherwise acceptable enough to freeze
      while hair is redesigned against the formal hair grammar.
    next_target: quest-girl-v5
    design_intent:
      - preserve-successful-face
      - replace-forehead-slabs-with-fringe-system
      - increase-coherent-hair-mass
      - eliminate-bald-spot
      - fuller-crown-side-back-hair
      - larger-ponytail-mass
      - minimize-visible-neck
      - head-nestled-into-torso
      - non-sexualized-cute-anime
