format: scenarium-constructive-3d
version: "0.1"

units: meters

coordinates:
  handedness: right
  up: y
  forward: -z

requires:
  - core.primitives
  - core.rigid-hierarchy

materials:
  rose:
    role: blanket-textile
    base_color: "#d7869f"
    roughness: 0.99
  rose_light:
    role: blanket-textile-accent
    base_color: "#efb4c5"
    roughness: 0.99
  rose_dark:
    role: blanket-textile-shadow
    base_color: "#b96884"
    roughness: 0.99
  cream:
    role: blanket-textile
    base_color: "#f0dfcf"
    roughness: 0.99

asset:
  id: block-chibi-chair-throw-blanket-v1
  name: Block Chibi Chair Throw Blanket v1
  kind: prop
  root: root
  tags: [blanket, block-chibi-room, chair-throw, grammar-specimen]

parts:
  root: {role: blanket-root, parent: null, articulation: static}

  rear_panel:
    role: blanket-rear-drape
    parent: root
    geometry: {kind: cuboid, size: [0.86, 0.34, 0.040]}
    material: rose_dark
    transform: {translate: [0.0, -0.17, 0.12]}

  top_turn:
    role: blanket-edge-turn
    parent: root
    geometry: {kind: cuboid, size: [0.86, 0.040, 0.26]}
    material: rose_light
    transform: {translate: [0.0, 0.020, 0.0]}

  front_panel:
    role: blanket-front-drape
    parent: root
    geometry: {kind: cuboid, size: [0.86, 0.72, 0.040]}
    material: rose
    transform: {translate: [0.0, -0.36, -0.12]}

extensions:
  taria:
    object_grammar: blanket@0.1
    style_grammar: block-chibi-room@0.1
    realization_grammar: block-chibi-room::blanket@0.1
    specimen_intent: chair-throw-blanket
    drape_contract:
      turn_edge_y: 0.0
      backrest_top_alignment: required
    render_shading: flat
    evaluation_status: awaiting-family-review
