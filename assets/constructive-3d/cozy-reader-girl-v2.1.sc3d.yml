      views: [front-three-quarter, front, side, rear-three-quarter]
      library_files:
        - image-gen-1(6).png
        - image-gen-2(6).png
        - image-gen-3(6).png
        - image-gen-4(3).png
      purpose: shape-costume-height-and-anatomy-authority
    repair_targets:
      - correct-total-height-and-head-body-ratio
      - lengthen-torso-and-legs
      - replace-bulbous-arm-and-hand-anatomy
      - shrink-head-dominance
      - remove-hair-self-penetration
      - make-hair-read-as-one-coherent-style
      - preserve-soft-cute-direction
    generation_policy: no-image-generation
    evaluation_status: awaiting-v2.1-static-review
