format: scenarium-constructive-3d
version: '0.1'
units: meters
coordinates:
  handedness: right
  up: y
  forward: -z

asset:
  id: cozy-reader-girl-v2.1
  name: Cozy Reader Girl v2.1
  kind: character
  root: root
  description: >-
    Anatomy-and-hair repair of Cozy Reader Girl v2. The approved multi-view references
    remain design authority. v2.1 lengthens the body and legs, reduces head dominance,
    replaces bulbous sleeve/hand anatomy, and rebuilds the hairstyle as a coherent
    crown plus narrow face locks and authored rear ribbons rather than intersecting
    ellipsoid masses.
  tags:
    - cute-character
    - cozy-reader
    - reference-derived
    - static-design-proof
    - anatomy-repair
    - hair-repair
    - v2.1

