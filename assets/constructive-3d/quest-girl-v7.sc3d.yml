extensions:
  taria:
    visual_language_target: style-target:block-chibi-quest
    style_exemplar: Pokemon Quest
    experiment_phase: static-beauty-v7
    predecessor: quest-girl-v6
    acceptance_gate: human-static-aesthetic-review
    evaluation_status: accepted-static-character
    evaluation_result: user-approved
    evaluated_at: 2026-10-04
    human_review_summary: >-
      v7 looks good and is accepted. The connected front hair remains
      successful, the side-hair cleanup is good enough, and static hair
      iteration is complete. Preserve v7 as the accepted static block-chibi
      character baseline for articulation tests.
    next_phase: rigid-articulation-proof
    hair_grammar: block-chibi-hair-grammar@0.3
    hair_archetype: soft-full-bangs-ponytail@0.3
    design_intent:
      - preserve-v6-connected-front-hair
      - hair-grammar-v0.3-visual-continuity
      - no-single-vertical-side-slab
      - stepped-side-to-back-wrap
      - side-hair-behind-face-plane
      - visible-continuity-to-crown-and-back
      - full-crown-back-coverage
      - visibly-connected-rear-ponytail
      - minimize-visible-neck
      - non-sexualized-cute-anime
