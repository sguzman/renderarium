format: scenarium-constructive-3d
version: "0.1"

units: meters

coordinates:
  handedness: right
  up: y
  forward: -z

asset:
  id: quest-girl-v7
  name: Quest Girl v7
  kind: character
  root: root
  description: >-
    Seventh SC3D block-chibi girl candidate. The accepted v6 connected-front
    hair is frozen. This iteration only replaces the remaining sideburn-like
    vertical side slabs with stepped side-to-back hair masses.
  tags:
    - block-chibi
    - pokemon-quest-target
    - cute-girl
    - static-beauty-proof
    - v7

requires:
  - core.primitives
  - core.rigid-hierarchy

parameters:
  head_width:
    type: number
    default: 1.18
    min: 1.00
    max: 1.40
    description: Chibi head width.

materials:
  skin:
    role: skin
    base_color: "#f3c9ae"
    roughness: 0.94

  hair:
    role: hair
    base_color: "#402536"
    roughness: 0.90

  hair_shadow:
    role: hair-shadow
    base_color: "#2f1c29"
    roughness: 0.92

  dress:
    role: costume-primary
    base_color: "#d77a9c"
    roughness: 0.92

  dress_dark:
    role: costume-secondary
    base_color: "#a44f72"
    roughness: 0.94

  cream:
    role: costume-trim
    base_color: "#f4e8d2"
    roughness: 0.96

  eye:
    role: facial-feature
    base_color: "#352635"
    roughness: 1.0

  eye_glint:
    role: facial-highlight
    base_color: "#fffaf1"
    roughness: 0.92

  blush:
    role: facial-accent
    base_color: "#e58c9c"
    roughness: 0.98

  shoe:
    role: footwear
    base_color: "#62404c"
    roughness: 0.94

